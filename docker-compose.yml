services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: multibase_backend
    restart: unless-stopped
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app/backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./db:/app/db

  frontend:
    build:
      context: ./frontend
    container_name: multibase_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

# Postgres, MongoDB, and Neo4j are all managed cloud services (Neon,
# Atlas, AuraDB) - see DECISIONS.md. Nothing stateful runs locally;
# DATABASE_URL / MONGO_URL / NEO4J_URI etc. all live in .env and are
# passed straight through via env_file above.
